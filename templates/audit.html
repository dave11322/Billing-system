{% extends "base.html" %}
{% block heading %}Audit trail{% endblock %}
{% block content %}
<div class="card"><input type="search" class="filter" data-filter="#audit" placeholder="Filter this table...">
<table id="audit"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>
{% for l in logs %}<tr><td>{{ l.created|date:"Y-m-d H:i" }}</td><td>{{ l.user.username|default:"-" }}</td><td>{{ l.action }}</td><td>{{ l.detail }}</td></tr>
{% empty %}<tr><td colspan="4" class="muted">No activity yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
